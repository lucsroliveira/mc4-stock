<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MC4 - Acesso Restrito</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-login"> <!-- Classe adicionada aqui -->
    <div class="container">
        <div class="row justify-content-center w-100 m-0">
            <div class="col-md-4 col-lg-3">
                <div class="text-center mb-4">
                    <h3 class="fw-bold text">MC4 ESTOQUE</h3>
                    <p class="text-muted">Painel de Controle de Materiais</p>
                </div>
                <div class="card shadow-lg border-0">
                    <div class="card-body p-4">
                        <form id="form-login">
                            <div class="mb-3">
                                <label class="form-label small fw-bold text-muted">E-MAIL</label>
                                <input type="email" id="login-email" class="form-control" placeholder="usuario@mc4.com.br" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label small fw-bold text-muted">SENHA</label>
                                <input type="password" id="login-senha" class="form-control" placeholder="••••••••" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2 shadow-sm">
                                <i class="fas fa-sign-in-alt me-2"></i>Entrar no Sistema
                            </button>
                        </form>
                    </div>
                </div>
                <div class="text-center mt-4">
                    <small class="text-muted">© 2026 MC4 Publicidade OOH</small>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/database.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
