<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MC4 Estoque - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="mobile-header d-md-none">
        <button class="btn-toggle" id="mobileMenuBtn">
            <i class="fas fa-bars"></i>
        </button>
        <span class="ms-3 text-white fw-bold">MC4 STOCK</span>
    </div>

    <nav id="sidebar">
        <div class="sidebar-header">
            <h4 class="fw-bold mb-0"><i class="fas fa-boxes-stacked"></i> MC4 STOCK</h4>
        </div>

        <div class="nav-sidebar">
            <a href="index.html" class="active"><i class="fas fa-chart-line"></i> Dashboard</a>
            <a href="consulta.html"><i class="fas fa-search"></i> Inventário</a>
            <a href="movimentacoes.html"><i class="fas fa-exchange-alt"></i> Movimentar</a>
            <a href="relatorios.html"><i class="fas fa-file-invoice"></i> Relatórios</a>
            <hr class="mx-3 opacity-25">
            <a href="itens.html"><i class="fas fa-microchip"></i> Itens</a>
            <a href="estoques.html"><i class="fas fa-warehouse"></i> Estoques</a>
            <a href="#" onclick="logout()" class="text-warning mt-5"><i class="fas fa-sign-out-alt"></i> Sair</a>
        </div>
    </nav>

    <div id="content">
        <button type="button" id="sidebarCollapse" class="btn btn-primary d-md-none mb-3">
            <i class="fas fa-bars"></i>
        </button>

        <div class="container-fluid">
            <div class="row mb-4">
                <div class="col-md-6 mb-4">
                    <div class="card shadow-sm h-100">
                        <div class="card-header bg-white">
                            <h6 class="mb-0 fw-bold text">Distribuição por Categoria</h6>
                        </div>
                        <div class="card-body justify-content-center" style="position: relative; height:300px;">
                            <canvas id="chartCategorias"></canvas>
                        </div>
                    </div>
                </div>
                <div class="col-md-6 mb-4">
                    <div class="card shadow-sm h-100">
                        <div class="card-header bg-white">
                            <h6 class="mb-0 fw-bold text">Movimentações (Últimos 7 Dias)</h6>
                        </div>
                        <div class="card-body" style="position: relative; height:300px;">
                            <canvas id="chartMovimentacoes"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row mb-4">
                <div class="col-md-6 mb-3">
                    <div class="card shadow-sm border-0">
                        <div class="card-body d-flex align-items-center">
                            <div class="rounded-circle bg-light p-3 me-3">
                                <i class="fas fa-microchip text-primary fs-4"></i>
                            </div>
                            <div>
                                <h6 class="text-muted mb-0">Itens no Catálogo</h6>
                                <h2 id="total-itens" class="fw-bold mb-0">--</h2>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="col-md-6 mb-3">
                    <div class="card shadow-sm border-0">
                        <div class="card-body d-flex align-items-center">
                            <div class="rounded-circle bg-light p-3 me-3">
                                <i class="fas fa-warehouse text-primary fs-4"></i>
                            </div>
                            <div>
                                <h6 class="text-muted mb-0">Locais Ativos</h6>
                                <h2 id="total-estoques" class="fw-bold mb-0">--</h2>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-lg-8 mb-4">
                    <div class="card shadow-sm border-0 h-100">
                        <div class="card-header bg-white py-3">
                            <h6 class="m-0 fw-bold">Histórico Recente</h6>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Data</th>
                                        <th>Item</th>
                                        <th>Tipo</th>
                                        <th>Origem/Destino</th>
                                        <th>Qtd</th>
                                    </tr>
                                </thead>
                                <tbody id="lista-movimentacoes"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="col-lg-4 mb-4">
                    <div class="card shadow-sm border-0 h-100">
                        <div class="card-header bg-white py-3">
                            <h6 class="m-0 fw-bold">Saldo Total</h6>
                        </div>
                        <div class="list-group list-group-flush" id="lista-saldo-geral"></div>
                    </div>
                </div>
            </div>
        </div> </div> <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        document.getElementById('mobileMenuBtn')?.addEventListener('click', function() {
            document.getElementById('sidebar').classList.toggle('active');
        });

        if (window.innerWidth < 768) {
            document.querySelectorAll('#sidebar a').forEach(link => {
                link.addEventListener('click', () => {
                    document.getElementById('sidebar').classList.remove('active');
                });
            });
        }
    </script>

    <script src="js/database.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
