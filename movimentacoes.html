<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MC4 - Movimentar Estoque</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="mobile-header d-md-none d-flex align-items-center px-3">
        <button class="btn-toggle" id="mobileMenuBtn">
            <i class="fas fa-bars"></i>
        </button>
         <img src="https://vkoeeykvdtaztqceftlf.supabase.co/storage/v1/object/public/fotos-itens/MC4%20STOCK_BRANCA_02.svg" 
            alt="Logo MC4 Stock" 
            class="ms-3" 
            style="height: 20px; width: auto;">
    </div>

    <nav id="sidebar">
        <div class="sidebar-header text-center py-2 d-none d-md-block">
             <img src="https://vkoeeykvdtaztqceftlf.supabase.co/storage/v1/object/public/fotos-itens/MC4%20STOCK_BRANCA_02.svg" 
            alt="Logo MC4 Stock"
            style="width: 80%; max-width: 90px; padding-top: 8px; padding-bottom: 8px;">
        </div>

        <div class="nav-sidebar">
            <a href="index.html"><i class="fas fa-chart-line"></i> Dashboard</a>
            <a href="consulta.html"><i class="fas fa-search"></i> Inventário</a>
            <a href="movimentacoes.html" class="active"><i class="fas fa-exchange-alt"></i> Movimentar</a>
            <a href="relatorios.html"><i class="fas fa-file-invoice"></i> Relatórios</a>
            <hr class="mx-3 opacity-25">
            <a href="itens.html"><i class="fas fa-microchip"></i> Itens</a>
            <a href="estoques.html"><i class="fas fa-warehouse"></i> Estoques</a>
            <a href="#" onclick="logout()" class="text-white mt-5"><i class="fas fa-sign-out-alt"></i> Sair</a>
        </div>
    </nav>

    <div id="content">
        <div class="container-fluid">
            <div class="row justify-content-center">
                <div class="col-md-10 col-lg-8">
                    
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h2 class="mb-0">Nova Movimentação</h2>
                    </div>

                    <div class="card shadow-sm border-0">
                        <div class="card-body p-4">
                            <form id="form-movimentacao">
                                <div class="mb-4">
                                    <label class="form-label fw-bold text-muted small uppercase">Item:</label>
                                    <select id="select-item" class="form-select form-select-lg" required>
                                        <option value="">Carregando itens...</option>
                                    </select>
                                </div>

                                <div class="row">
                                    <div class="col-12 mb-4">
                                        <label class="form-label fw-bold text-muted small uppercase">Tipo de Operação:</label>
                                        <select id="select-tipo" class="form-select" required>
                                            <option value="transferencia">Transferência (Entre estoques)</option>
                                            <option value="entrada">Entrada (Novo item no estoque)</option>
                                            <option value="saida">Saída (Retirada/Baixa)</option>
                                        </select>
                                    </div>

                                    <div class="col-md-6 mb-4" id="col-origem">
                                        <label class="form-label fw-bold text-muted small uppercase">Origem:</label>
                                        <select id="select-origem" class="form-select">
                                            <option value="">Selecione a origem</option>
                                        </select>
                                    </div>

                                    <div class="col-md-6 mb-4" id="col-destino">
                                        <label class="form-label fw-bold text-muted small uppercase">Destino:</label>
                                        <select id="select-destino" class="form-select">
                                            <option value="">Selecione o destino</option>
                                        </select>
                                    </div>

                                    <div class="col-12 mb-4">
                                        <label class="form-label fw-bold text-muted small uppercase">Quantidade:</label>
                                        <input type="number" id="mov-quantidade" class="form-control form-control-lg" placeholder="0" required min="1">
                                        
                                        <div id="info-saldo" class="mt-2 d-none">
                                            <div class="alert alert-info py-2 px-3 mb-0 d-flex align-items-center">
                                                <i class="fas fa-info-circle me-2"></i>
                                                <span>Saldo disponível: <strong id="valor-disponivel">0</strong></span>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-12 mb-4">
                                        <label class="form-label fw-bold text-muted small uppercase">Motivo / Observação:</label>
                                        <textarea id="mov-motivo" class="form-control" rows="2" placeholder="Ex: Motivo de... e retirado por..." required></textarea>
                                    </div>
                                </div>

                                <div class="pt-2">
                                    <button type="submit" class="btn btn-primary btn-lg w-100 shadow-sm" id="btn-confirmar">
                                        <i class="fas fa-check-circle me-2"></i>Confirmar Movimentação
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        document.getElementById('mobileMenuBtn')?.addEventListener('click', function() {
            document.getElementById('sidebar').classList.toggle('active');
        });
    </script>

    <script src="js/database.js"></script>
    <script src="js/movimentacoes.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
