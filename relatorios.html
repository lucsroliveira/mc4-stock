<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MC4 - Relatórios e Auditoria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

   <div class="mobile-header d-md-none d-flex align-items-center px-3">
        <button class="btn-toggle" id="mobileMenuBtn">
            <i class="fas fa-bars"></i>
        </button>
        <img src="https://vkoeeykvdtaztqceftlf.supabase.co/storage/v1/object/public/fotos-itens/MC4%20STOCK_BRANCA_02.svg" 
            alt="Logo MC4 Stock" 
            class="ms-3" 
            style="height: 20px; width: auto;">
    </div>

    <nav id="sidebar">
        <div class="sidebar-header text-center py-2 d-none d-md-block">
             <img src="https://vkoeeykvdtaztqceftlf.supabase.co/storage/v1/object/public/fotos-itens/MC4%20STOCK_BRANCA_02.svg" 
            alt="Logo MC4 Stock"
            style="width: 80%; max-width: 90px; padding-top: 8px; padding-bottom: 8px;">
        </div>

        <div class="nav-sidebar">
            <a href="index.html"><i class="fas fa-chart-line"></i> Dashboard</a>
            <a href="consulta.html"><i class="fas fa-search"></i> Inventário</a>
            <a href="movimentacoes.html"><i class="fas fa-exchange-alt"></i> Movimentar</a>
            <a href="relatorios.html" class="active"><i class="fas fa-file-invoice"></i> Relatórios</a>
            <hr class="mx-3 opacity-25">
            <a href="itens.html"><i class="fas fa-microchip"></i> Itens</a>
            <a href="estoques.html"><i class="fas fa-warehouse"></i> Estoques</a>
            <a href="#" onclick="logout()" class="text-white mt-5"><i class="fas fa-sign-out-alt"></i> Sair</a>
        </div>
    </nav>
    <div id="content">
        <div class="container-fluid">
            
            <div class="d-flex justify-content-between align-items-center mb-4 no-print">
                <h2 class="mb-0">Relatórios e Auditoria</h2>
                <div>
                    <button class="btn btn-outline-success me-2 shadow-sm" onclick="exportarCSV()">
                        <i class="fas fa-file-csv me-2"></i>Exportar CSV
                    </button>
                    <button class="btn btn-outline-secondary shadow-sm" onclick="window.print()">
                        <i class="fas fa-print me-2"></i>Imprimir PDF
                    </button>
                </div>
            </div>

            <div class="card shadow-sm mb-4 no-print border-0">
                <div class="card-body">
                    <form id="form-filtro" class="row g-3 align-items-end">
                        <div class="col-md-3">
                            <label class="form-label small fw-bold text-muted">DATA INÍCIO</label>
                            <input type="date" id="data-inicio" class="form-control">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-bold text-muted">DATA FIM</label>
                            <input type="date" id="data-fim" class="form-control">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-bold text-muted">TIPO</label>
                            <select id="filtro-tipo" class="form-select">
                                <option value="">Todos os tipos</option>
                                <option value="entrada">Entradas</option>
                                <option value="saida">Saídas</option>
                                <option value="transferencia">Transferências</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <button type="submit" class="btn btn-primary w-100 shadow-sm">
                                <i class="fas fa-filter me-2"></i>Filtrar Dados
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3 d-flex align-items-center">
                    <h5 class="mb-0 fw-bold"><i class="fas fa-history me-2 text"></i>Histórico de Movimentações</h5>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Data/Hora</th>
                                <th>Item</th> 
                                <th class="text-center">Tipo</th>
                                <th class="text-center">Qtd</th>
                                <th>Origem <i class="fas fa-arrow-right mx-1 small text-muted"></i> Destino</th>
                                <th>Motivo / Observação</th>
                                <th>Usuário</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-relatorio">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Menu Mobile
        document.getElementById('mobileMenuBtn')?.addEventListener('click', function() {
            document.getElementById('sidebar').classList.toggle('active');
        });
    </script>

    <script src="js/database.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/relatorios.js"></script>
</body>
</html>
